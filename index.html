<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="score_board">
        <h3>Scoreboard</h3>
        <p id="p1">Player 1: 0</p>
        <p id="p2">Player 2: 0</p>
    </div>
    <div id="gameboard">
        <div class="panel" id="panel-1"></div>
        <div class="panel" id="panel-2"></div>
        <div class="panel" id="panel-3"></div>
        <div class="panel" id="panel-4"></div>
        <div class="panel" id="panel-5"></div>
        <div class="panel" id="panel-6"></div>
        <div class="panel" id="panel-7"></div>
        <div class="panel" id="panel-8"></div>
        <div class="panel" id="panel-9"></div>
    </div>
    <div class="player_choice">
        <h3>Player 1 choose your symbol</h3>
        <input type="radio" name="player_choice" id="choose_x">
        <label for="player_choice">Play as X</label>
        <input type="radio" name="player_choice" id="choose_0">
        <label for="player_choice">Play as O</label>
    </div>
    <script src="script.js"></script>
</body>

</html>
